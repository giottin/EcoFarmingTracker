<div class="flex flex-col items-center pt-2">
  @if (loading()) {
    <div class="loading-state">Chargement des champs partagés…</div>
  }

  @for (field of fields(); track field.id; let index = $index) {
    <app-field-row [field]="field" [sortOrder]="index" (rowClosed)="onRowClosed(field)" class="w-full my-1">
    </app-field-row>
  }

  <div class="py-2">
    <button type="button" class="add-field" [disabled]="adding()" (click)="addRandomField()" aria-label="Ajouter un champ">
      <span class="material-icons text-5xl">{{ adding() ? 'hourglass_top' : 'add_circle' }}</span>
    </button>
  </div>
</div>
