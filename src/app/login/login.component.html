<main class="login-shell">
  <section class="login-card">
    <div class="eyebrow">Espace privé Eco</div>
    <h1>Retrouvez vos outils partagés</h1>
    <p>Entrez une adresse ajoutée par un administrateur pour accéder directement aux outils.</p>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Adresse email</mat-label>
      <input matInput type="email" [(ngModel)]="email" (keyup.enter)="connect()" autocomplete="email">
    </mat-form-field>
    <button mat-flat-button class="w-full" [disabled]="connecting() || !email" (click)="connect()">
      {{ connecting() ? 'Connexion…' : 'Accéder au site' }}
    </button>
    @if (error()) {
      <p class="error-message">{{ error() }}</p>
    }
  </section>
</main>
